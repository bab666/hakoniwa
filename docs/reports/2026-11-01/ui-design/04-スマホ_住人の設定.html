<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<title>スマホ 住人の設定 整理案</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1d4f7a}a:hover{color:#123553}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #ffffff; color: #17202b; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.5">

  <div style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 4px; border-bottom: 1px solid #edf0f2">
    <a href="PhoneList.dc.html" aria-label="住人一覧に戻る" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: #17202b">
      <svg width="18" height="18" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5"></path></svg>
    </a>
    <span style="flex: 0 0 auto; display: inline-flex; width: 34px; height: 34px; border-radius: 17px; border: 2px solid #b03a2e; color: #b03a2e; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; box-sizing: border-box">朝</span>
    <div style="flex: 1 1 auto; min-width: 0; padding-left: 6px">
      <h2 style="margin: 0; font-size: 16px">朝霧の設定</h2>
      <div style="font-size: 11px; color: #5b6672"><span style="font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em">BDACD</span>・強気</div>
    </div>
    <button type="button" aria-label="前の住人" style="width: 44px; height: 44px; border: 0; background: none; color: #17202b; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 7.5L6 4l3.5 3.5"></path></svg>
    </button>
    <button type="button" aria-label="次の住人" style="width: 44px; height: 44px; border: 0; background: none; color: #17202b; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5"></path></svg>
    </button>
  </div>

  <nav aria-label="設定の節" style="display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; border-bottom: 1px solid #edf0f2; white-space: nowrap">
    <sc-for list="{{secs}}" as="s" hint-placeholder-count="7">
      <a href="#" aria-current="{{s.cur}}" style="flex: 0 0 auto; display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; text-decoration: none; font-size: 13px; font-weight: {{s.weight}}">{{s.name}}</a>
    </sc-for>
  </nav>

  <div style="padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 8px">
      <h3 style="margin: 0; font-size: 17px">プロフィール</h3>
      <button type="button" aria-label="プロフィールのヒント" style="width: 28px; height: 28px; border: 1px solid #cfd6dd; border-radius: 14px; background: #ffffff; font: inherit; font-size: 12px; color: #4a5562">?</button>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; font-weight: 700">性別</legend>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid #cfd6dd; border-radius: 8px; overflow: hidden">
        <button type="button" aria-pressed="true" style="height: 42px; border: 0; background: {{accent}}; color: #ffffff; font: inherit; font-size: 13px; font-weight: 700">おまかせ</button>
        <button type="button" aria-pressed="false" style="height: 42px; border: 0; border-left: 1px solid #cfd6dd; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">男性</button>
        <button type="button" aria-pressed="false" style="height: 42px; border: 0; border-left: 1px solid #cfd6dd; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">女性</button>
        <button type="button" aria-pressed="false" style="height: 42px; border: 0; border-left: 1px solid #cfd6dd; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">その他</button>
      </div>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700">恋愛対象</span>
      <sc-raw-select style="height: 44px; padding: 0 10px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 16px; color: #17202b"><option>おまかせ（制限なし）</option><option>男性</option><option>女性</option><option>男女両方</option><option>なし（興味なし）</option></sc-raw-select>
    </label>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 700">誕生月</span>
        <sc-raw-select style="height: 44px; padding: 0 10px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 16px; color: #17202b"><option>決めない</option><option>1月</option></sc-raw-select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 700">年齢</span>
        <input type="text" inputmode="numeric" placeholder="決めない" style="height: 44px; padding: 0 10px; border: 1px solid #cfd6dd; border-radius: 8px; font: inherit; font-size: 16px; color: #17202b">
      </label>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700">お酒</span>
      <sc-raw-select style="height: 44px; padding: 0 10px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 16px; color: #17202b"><option>おまかせ</option><option>弱い</option><option>ふつう</option><option>強い</option><option>ザル</option></sc-raw-select>
    </label>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #dde2e7; border-radius: 10px">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: #b03a2e"></span>
      <span style="flex: 1 1 auto">
        <span style="display: block; font-size: 13px; font-weight: 700">イメージカラー</span>
        <span style="display: block; font-size: 12px; color: #5b6672">自動（並び順の色）</span>
      </span>
      <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">変える</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 16px 24px; background: #ffffff; border-top: 1px solid #dde2e7">
    <button type="button" style="flex: 1 1 auto; height: 48px; border: 1px solid #cfd6dd; border-radius: 10px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">次の節：体と設定</button>
    <a href="PhoneList.dc.html" style="flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 96px; height: 48px; border-radius: 10px; background: {{accent}}; color: #ffffff; text-decoration: none; font-weight: 700">完了</a>
  </div>
</div>
</x-dc>



</body></html>
