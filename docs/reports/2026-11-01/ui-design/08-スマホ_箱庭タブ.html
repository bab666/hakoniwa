<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<title>スマホ 箱庭タブ 整理案</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1d4f7a}a:hover{color:#123553}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f4f5f7; color: #17202b; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.5">

  <header style="background: #ffffff; border-bottom: 1px solid #dde2e7; padding: 10px 16px 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#17202b" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="11"></circle><path d="M12 5l6 3.5v7L12 19l-6-3.5v-7z M12 12l6-3.5 M12 12v7 M12 12L6 8.5"></path></svg>
      <div style="flex: 1 1 auto; font-weight: 700; letter-spacing: 0.06em">箱庭シミュレーター</div>
      <button type="button" aria-label="セーブ" style="width: 44px; height: 44px; border: 0; background: none; color: #17202b; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M2 2.5h7.5L12 5v6.5H2z M4.5 2.5v3h4v-3 M4 11.5V8h6v3.5"></path></svg>
      </button>
      <button type="button" aria-label="メニュー（遊び方・注意事項・表示）" style="width: 44px; height: 44px; border: 0; background: none; color: #17202b; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" sc-camel-view-box="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5.5h14 M3 10h14 M3 14.5h14"></path></svg>
      </button>
    </div>
    <div role="tablist" aria-label="手順" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 4px">
      <button type="button" role="tab" aria-selected="false" style="height: 44px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; color: #4a5562">1 住人</button>
      <button type="button" role="tab" aria-selected="true" style="height: 44px; border: 0; border-bottom: 3px solid {{accent}}; background: none; font: inherit; font-weight: 700; color: #17202b">2 箱庭</button>
      <button type="button" role="tab" aria-selected="false" style="height: 44px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; color: #4a5562">3 結末</button>
    </div>
  </header>

  <div style="padding: 12px 16px 0">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #ffffff; border: 1px solid #dde2e7; border-radius: 12px">
      <div style="flex: 1 1 auto; min-width: 0">
        <div style="font-size: 11px; color: #5b6672">恋愛・社交・2〜12人</div>
        <div style="font-weight: 700; font-size: 17px">合コン</div>
        <div style="font-size: 12px; color: #4a5562; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">居酒屋の個室で一晩の合コン。</div>
      </div>
      <button type="button" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border: 1px solid {{accent}}; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; font-weight: 700; color: {{accent}}">変える</button>
    </div>
  </div>

  <nav aria-label="箱庭の設定" style="display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; white-space: nowrap">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="#" aria-current="{{t.cur}}" style="flex: 0 0 auto; display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; text-decoration: none; font-size: 13px; font-weight: {{t.weight}}">{{t.name}}</a>
    </sc-for>
  </nav>

  <section aria-label="起こりやすさ" style="margin: 0 16px; padding: 0 16px; background: #ffffff; border: 1px solid #dde2e7; border-radius: 12px">
    <sc-for list="{{sliders}}" as="s" hint-placeholder-count="4">
      <label style="display: block; padding: 12px 0; border-bottom: 1px solid #edf0f2">
        <span style="display: flex; justify-content: space-between; font-weight: 700; font-size: 14px">{{s.name}}<span style="font-family: ui-monospace, Menlo, Consolas, monospace">{{s.val}}</span></span>
        <input type="range" min="0" max="100" value="{{s.val}}" style="width: 100%; margin: 6px 0 0; accent-color: {{accent}}">
        <span style="display: flex; justify-content: space-between; font-size: 11px; color: #5b6672"><span>{{s.lo}}</span><span>{{s.hi}}</span></span>
      </label>
    </sc-for>
    <div style="display: flex; gap: 8px; padding: 12px 0">
      <button type="button" style="flex: 1 1 0; height: 40px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">初期値に戻す</button>
      <button type="button" style="flex: 1 1 0; height: 40px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">ランダム</button>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 16px 24px; background: #ffffff; border-top: 1px solid #dde2e7; box-shadow: 0 -4px 16px rgba(23,32,43,0.06)">
    <button type="button" aria-label="シードを決める（いま：ランダム）" style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 72px; height: 52px; border: 1px solid #cfd6dd; border-radius: 10px; background: #ffffff; font: inherit; color: #17202b">
      <span style="font-size: 11px; color: #5b6672">シード</span>
      <span style="font-size: 12px">ランダム</span>
    </button>
    <button type="button" style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 52px; border: 0; border-radius: 10px; background: {{accent}}; color: #ffffff; font: inherit">
      <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px">
        <svg width="12" height="12" sc-camel-view-box="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3.5 2l8 5-8 5z"></path></svg>箱庭を動かす
      </span>
      <span style="font-size: 11px; opacity: 0.8">合コン・10人</span>
    </button>
  </div>
</div>
</x-dc>



</body></html>
