<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<title>スマホ 経過 整理案</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1d4f7a}a:hover{color:#123553}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #ffffff; color: #17202b; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.5">

  <div style="padding: 10px 8px 0 16px; border-bottom: 1px solid #edf0f2">
    <div style="display: flex; align-items: center; gap: 4px">
      <div style="flex: 1 1 auto; min-width: 0">
        <div style="font-size: 11px; color: #5b6672">合コン・10人・シード 101217</div>
        <div style="font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">終電で解散 ― 鷹野と柚木が恋人に</div>
      </div>
      <button type="button" aria-haspopup="menu" aria-label="保存・共有" style="width: 44px; height: 44px; border: 0; background: none; color: #17202b; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M7 1.5v8 M4 4.5l3-3 3 3 M2 8.5v3.5h10V8.5"></path></svg>
      </button>
    </div>
    <div role="tablist" aria-label="結果の見方" style="display: flex; gap: 2px; overflow-x: auto; white-space: nowrap">
      <button type="button" role="tab" aria-selected="false" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; color: #4a5562">結末</button>
      <button type="button" role="tab" aria-selected="true" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border: 0; border-bottom: 3px solid {{accent}}; background: none; font: inherit; font-weight: 700; color: #17202b">経過</button>
      <button type="button" role="tab" aria-selected="false" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; color: #4a5562">関係図</button>
      <button type="button" role="tab" aria-selected="false" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; color: #4a5562">二人ずつ</button>
      <button type="button" role="tab" aria-selected="false" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; color: #4a5562">住人ごと</button>
    </div>
  </div>

  <button type="button" aria-haspopup="listbox" aria-label="区切りを選ぶ（いま：T02 自己紹介）" style="display: flex; width: 100%; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border: 0; border-bottom: 1px solid #edf0f2; background: #f8f9fa; font: inherit; color: #17202b; text-align: left">
    <span style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #5b6672">T02</span>
    <b style="font-size: 15px">19:40　自己紹介</b>
    <span style="flex: 1 1 auto"></span>
    <span style="font-size: 12px; color: #5b6672">2 / 9</span>
    <svg width="12" height="12" sc-camel-view-box="0 0 12 12" fill="none" stroke="#5b6672" stroke-width="1.6" aria-hidden="true"><path d="M3 4.5l3 3 3-3"></path></svg>
  </button>

  <div style="padding: 0 20px 140px; font-size: {{fs}}px; line-height: 1.9">
    <div style="padding: 14px 0; border-bottom: 1px solid #f1f3f5">
      <div style="font-size: 11px; color: #5b6672; line-height: 1.5">交流</div>
      <p style="margin: 0"><b style="color: #2a6f9e">鷹野</b>「最近観た映画で一番よかったのは？」　「好きな映画」の話はそこそこ盛り上がった。<b style="color: #a83d70">雪村</b>がいちばん楽しそうだった。</p>
    </div>
    <div style="padding: 14px 0; border-bottom: 1px solid #f1f3f5">
      <div style="font-size: 11px; color: #5b6672; line-height: 1.5">恋愛</div>
      <p style="margin: 0"><b style="color: #4f5b66">灰谷</b>「……目を見て話すのは苦手だ。すまない」<br><b style="color: #2a6f9e">鷹野</b>「じゃあ、横向いて話そう」</p>
    </div>
    <div style="margin: 10px -12px; padding: 12px; background: #fbf4ef; border-radius: 10px">
      <div style="display: flex; gap: 6px; align-items: center; font-size: 11px; line-height: 1.5"><span style="padding: 0 6px; border-radius: 4px; background: #a8361f; color: #ffffff; font-weight: 700">重要</span><span style="color: #5b6672">恋愛</span></div>
      <p style="margin: 2px 0 0; font-weight: 700"><b style="color: #8a6a0e">白石</b>は髪型を変えたばかりで、何度も触っていた。</p>
    </div>
    <div style="padding: 14px 0; border-bottom: 1px solid #f1f3f5">
      <div style="font-size: 11px; color: #5b6672; line-height: 1.5">対立</div>
      <p style="margin: 0"><b style="color: #1f7272">鷲尾</b>「ここは譲れねえ」<br><b style="color: #8a6a0e">白石</b>「こっちもだ」<br>二人は睨み合ったまま動かなかった。</p>
    </div>
    <div style="padding: 14px 0">
      <div style="font-size: 11px; color: #5b6672; line-height: 1.5">恋愛・らしくない</div>
      <p style="margin: 0">いつもは本音を言わずに強がってばかりの<b style="color: #2e7d4f">ミナト</b>が、<b style="color: #7a4699">黒田</b>の服の裾をそっとつまんだ。</p>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 10px 16px 24px; background: #ffffff; border-top: 1px solid #dde2e7; box-shadow: 0 -4px 16px rgba(23,32,43,0.06)">
    <button type="button" style="flex: 0 0 auto; display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 14px; border: 1px solid #cfd6dd; border-radius: 10px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">
      <svg width="16" height="16" sc-camel-view-box="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5h12 M5.5 9h7 M8 13h2"></path></svg>
      絞り込み・文字
    </button>
    <button type="button" aria-label="前の区切り" style="width: 48px; height: 48px; border: 1px solid #cfd6dd; border-radius: 10px; background: #ffffff; color: #17202b; display: flex; align-items: center; justify-content: center">
      <svg width="14" height="14" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5"></path></svg>
    </button>
    <button type="button" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 0; border-radius: 10px; background: {{accent}}; color: #ffffff; font: inherit; font-weight: 700">
      次の区切り：盛り上がり
      <svg width="12" height="12" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4.5 2.5L8 6 4.5 9.5"></path></svg>
    </button>
  </div>
</div>
</x-dc>



</body></html>
