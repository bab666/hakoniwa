<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<title>スマホ 住人タブ 整理案</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1d4f7a}a:hover{color:#123553}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f4f5f7; color: #17202b; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.5">

  <header style="background: #ffffff; border-bottom: 1px solid #dde2e7; padding: 10px 16px 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#17202b" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="11"></circle><path d="M12 5l6 3.5v7L12 19l-6-3.5v-7z M12 12l6-3.5 M12 12v7 M12 12L6 8.5"></path></svg>
      <div style="flex: 1 1 auto; font-weight: 700; letter-spacing: 0.06em">箱庭シミュレーター</div>
      <button type="button" aria-label="セーブ" style="width: 44px; height: 44px; border: 0; background: none; color: #17202b; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M2 2.5h7.5L12 5v6.5H2z M4.5 2.5v3h4v-3 M4 11.5V8h6v3.5"></path></svg>
      </button>
      <button type="button" aria-label="メニュー（遊び方・注意事項・表示）" style="width: 44px; height: 44px; border: 0; background: none; color: #17202b; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" sc-camel-view-box="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5.5h14 M3 10h14 M3 14.5h14"></path></svg>
      </button>
    </div>
    <div role="tablist" aria-label="手順" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 4px">
      <button type="button" role="tab" aria-selected="true" style="height: 44px; border: 0; border-bottom: 3px solid {{accent}}; background: none; font: inherit; font-weight: 700; color: #17202b">1 住人</button>
      <button type="button" role="tab" aria-selected="false" style="height: 44px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; color: #4a5562">2 箱庭</button>
      <button type="button" role="tab" aria-selected="false" style="height: 44px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; color: #4a5562">3 結末</button>
    </div>
  </header>

  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div role="tablist" aria-label="住人タブの中" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; background: #e6e9ed; border-radius: 10px">
      <button type="button" role="tab" aria-selected="true" style="height: 36px; border: 0; border-radius: 8px; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.12); font: inherit; font-size: 13px; font-weight: 700; color: #17202b">住人 10</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 8px; background: none; font: inherit; font-size: 13px; color: #4a5562">口調</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 8px; background: none; font: inherit; font-size: 13px; color: #4a5562">話題</button>
    </div>
    <div style="display: flex; gap: 8px">
      <label style="display: flex; align-items: center; gap: 8px; flex: 1 1 auto; height: 44px; padding: 0 12px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; box-sizing: border-box">
        <svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="#5b6672" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
        <input type="search" aria-label="住人を探す" placeholder="名前・メモ・タグで探す" style="flex: 1 1 auto; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; background: none">
      </label>
      <button type="button" aria-label="並び・グループで絞る" style="width: 44px; height: 44px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; color: #17202b; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" sc-camel-view-box="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5h12 M5.5 9h7 M8 13h2"></path></svg>
      </button>
    </div>
  </div>

  <ul style="list-style: none; margin: 10px 16px 0; padding: 0; background: #ffffff; border: 1px solid #dde2e7; border-radius: 12px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <li style="display: flex; align-items: center; border-bottom: 1px solid #edf0f2">
        <a href="PhoneSettings.dc.html" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 0 0 14px; text-decoration: none; color: #17202b">
          <span style="flex: 0 0 auto; display: inline-flex; width: 40px; height: 40px; border-radius: 20px; border: 2px solid {{r.color}}; color: {{r.color}}; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; box-sizing: border-box">{{r.ini}}</span>
          <span style="flex: 1 1 auto; min-width: 0">
            <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-weight: 700; font-size: 15px">{{r.name}}</span><span style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; color: #4a5562">{{r.code}}</span></span>
            <span style="display: block; font-size: 12px; color: #5b6672; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
          </span>
          <svg width="14" height="14" sc-camel-view-box="0 0 12 12" fill="none" stroke="#9aa5b1" stroke-width="1.6" aria-hidden="true" style="flex: 0 0 auto"><path d="M4.5 2.5L8 6 4.5 9.5"></path></svg>
        </a>
        <button type="button" aria-haspopup="menu" aria-label="{{r.moreLabel}}" style="flex: 0 0 auto; width: 48px; height: 64px; border: 0; background: none; color: #4a5562; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3.5" r="1.4"></circle><circle cx="8" cy="8" r="1.4"></circle><circle cx="8" cy="12.5" r="1.4"></circle></svg>
        </button>
      </li>
    </sc-for>
  </ul>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 16px 24px; background: #ffffff; border-top: 1px solid #dde2e7; box-shadow: 0 -4px 16px rgba(23,32,43,0.06)">
    <button type="button" style="flex: 0 0 auto; display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 14px; border: 1px solid #cfd6dd; border-radius: 10px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">
      <svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5h7l3 3v8H3z M5.5 7h5 M5.5 9.5h5"></path></svg>
      取り込み
    </button>
    <button type="button" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 0; border-radius: 10px; background: {{accent}}; color: #ffffff; font: inherit; font-weight: 700">
      <svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 2v10 M2 7h10"></path></svg>
      住人を追加
    </button>
  </div>
</div>
</x-dc>



</body></html>
