<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<title>参加者と初動 整理案</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1d4f7a}a:hover{color:#123553}
</style>
</helmet>
<div style="position: relative; min-height: 960px; background: #f4f5f7; color: #17202b; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.6">
  <main style="max-width: 1200px; margin: 0 auto; padding: 24px 24px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: #ffffff; border: 1px solid #dde2e7; border-radius: 12px">
      <span style="font-size: 12px; color: #5b6672">選んだ箱庭</span>
      <span style="font-weight: 700; font-size: 16px">合コン</span>
      <span style="font-size: 12px; color: #5b6672">恋愛・社交・2〜12人</span>
      <div style="flex: 1 1 auto"></div>
      <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid {{accent}}; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; font-weight: 700; color: {{accent}}">箱庭を変える</button>
    </div>

    <div role="tablist" aria-label="箱庭の設定" style="align-self: flex-start; display: flex; flex-wrap: wrap; padding: 3px; background: #e6e9ed; border-radius: 10px">
      <button type="button" role="tab" aria-selected="true" style="height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.12); font: inherit; font-weight: 700; color: #17202b">参加者と初動 <span style="font-weight: 400; font-size: 12px; color: #5b6672">10/12</span></button>
      <button type="button" role="tab" aria-selected="false" style="height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: none; font: inherit; color: #4a5562">場の設定</button>
      <button type="button" role="tab" aria-selected="false" style="height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: none; font: inherit; color: #4a5562">起こりやすさ</button>
      <button type="button" role="tab" aria-selected="false" style="height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: none; font: inherit; color: #4a5562">展開と内容</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <span style="font-size: 14px"><b>参加 10人</b><span style="color: #5b6672"> ／ 上限 12人</span></span>
      <div style="flex: 1 1 auto"></div>
      <button type="button" style="height: 38px; padding: 0 12px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">全員を参加</button>
      <button type="button" style="height: 38px; padding: 0 12px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">全員を外す</button>
      <div style="display: flex; align-items: center; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; overflow: hidden">
        <label style="display: flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; font-size: 13px; color: #3b4652">ランダムに
          <input type="number" value="4" min="1" max="12" style="width: 48px; height: 36px; border: 0; font: inherit; text-align: center; color: #17202b">人
        </label>
        <button type="button" style="height: 38px; padding: 0 12px; border: 0; border-left: 1px solid #cfd6dd; background: #f8f9fa; font: inherit; font-size: 13px; color: #17202b">選ぶ</button>
      </div>
    </div>

    <div style="overflow-x: auto; background: #ffffff; border: 1px solid #dde2e7; border-radius: 12px">
      <div style="min-width: 900px">
        <div style="display: grid; grid-template-columns: 64px 200px repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; padding: 10px 16px 6px; background: #f8f9fa; font-size: 12px; color: #5b6672">
          <span>参加</span><span>住人</span><span>最初の行動</span><span>短期目標</span><span>酒の強さ</span><span>見た目の自信</span>
        </div>
        <div style="display: grid; grid-template-columns: 64px 200px repeat(4, minmax(0, 1fr)); gap: 10px; align-items: center; padding: 6px 16px 10px; background: #f8f9fa; border-bottom: 1px solid #dde2e7">
          <span></span>
          <span style="font-size: 12px; color: #3b4652; font-weight: 700">まとめて変える</span>
          <sc-raw-select aria-label="最初の行動をまとめて変える" style="height: 34px; padding: 0 8px; border: 1px dashed #aab4be; border-radius: 6px; background: #ffffff; font: inherit; font-size: 12px; color: #4a5562"><option>全員に…</option></sc-raw-select>
          <sc-raw-select aria-label="短期目標をまとめて変える" style="height: 34px; padding: 0 8px; border: 1px dashed #aab4be; border-radius: 6px; background: #ffffff; font: inherit; font-size: 12px; color: #4a5562"><option>全員に…</option></sc-raw-select>
          <sc-raw-select aria-label="酒の強さをまとめて変える" style="height: 34px; padding: 0 8px; border: 1px dashed #aab4be; border-radius: 6px; background: #ffffff; font: inherit; font-size: 12px; color: #4a5562"><option>全員に…</option></sc-raw-select>
          <sc-raw-select aria-label="見た目の自信をまとめて変える" style="height: 34px; padding: 0 8px; border: 1px dashed #aab4be; border-radius: 6px; background: #ffffff; font: inherit; font-size: 12px; color: #4a5562"><option>全員に…</option></sc-raw-select>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
          <div style="display: grid; grid-template-columns: 64px 200px repeat(4, minmax(0, 1fr)); gap: 10px; align-items: center; padding: 6px 16px; border-bottom: 1px solid #edf0f2">
            <label style="display: flex; align-items: center; height: 44px">
              <input type="checkbox" checked="" aria-label="{{r.joinLabel}}" style="width: 20px; height: 20px; accent-color: {{accent}}">
            </label>
            <div style="min-width: 0">
              <div style="display: flex; align-items: center; gap: 8px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{r.color}}"></span>{{r.name}}</div>
              <div style="font-size: 11px; color: #5b6672; white-space: nowrap">{{r.prof}}</div>
            </div>
            <sc-raw-select style="height: 36px; padding: 0 8px; border: 1px solid {{r.b1}}; border-radius: 6px; background: {{r.bg1}}; font: inherit; font-size: 13px; color: {{r.c1}}"><option>{{r.act}}</option></sc-raw-select>
            <sc-raw-select style="height: 36px; padding: 0 8px; border: 1px solid {{r.b2}}; border-radius: 6px; background: {{r.bg2}}; font: inherit; font-size: 13px; color: {{r.c2}}"><option>{{r.goal}}</option></sc-raw-select>
            <sc-raw-select style="height: 36px; padding: 0 8px; border: 1px solid #e3e7eb; border-radius: 6px; background: #ffffff; font: inherit; font-size: 13px; color: #6b7682"><option>ランダム</option></sc-raw-select>
            <sc-raw-select style="height: 36px; padding: 0 8px; border: 1px solid #e3e7eb; border-radius: 6px; background: #ffffff; font: inherit; font-size: 13px; color: #6b7682"><option>ランダム</option></sc-raw-select>
          </div>
        </sc-for>
      </div>
    </div>
    <p style="margin: 0; font-size: 12px; color: #5b6672">変えた欄だけ濃く表示します。性別・恋愛対象は住人の「設定」で変えます（名前の下に今の値を表示）。</p>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: {{accent}}; color: #ffffff">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <div style="font-size: 13px; opacity: 0.85">合コン・参加 10人・初動 2か所を変更</div>
      <div style="flex: 1 1 auto"></div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px">シード
        <input type="text" placeholder="空欄でランダム" style="width: 140px; height: 40px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; background: rgba(255,255,255,0.08); color: #ffffff; font: inherit">
      </label>
      <button type="button" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px; border: 0; border-radius: 10px; background: #ffffff; color: {{accent}}; font: inherit; font-size: 15px; font-weight: 700">
        <svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3.5 2l8 5-8 5z"></path></svg>
        箱庭を動かす
      </button>
    </div>
  </div>
</div>
</x-dc>



</body></html>
