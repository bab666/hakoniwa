<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<title>箱庭を選ぶ 整理案</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1d4f7a}a:hover{color:#123553}
</style>
</helmet>
<div style="min-height: 900px; background: #5d6670; padding: 32px 16px; box-sizing: border-box; color: #17202b; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.6">
  <div role="dialog" aria-modal="true" aria-labelledby="pick-title" style="max-width: 1120px; margin: 0 auto; background: #ffffff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden">

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #dde2e7">
      <h2 id="pick-title" style="margin: 0; font-size: 18px">箱庭を選ぶ</h2>
      <span style="font-size: 13px; color: #5b6672">16種類</span>
      <div style="flex: 1 1 auto"></div>
      <button type="button" aria-label="閉じる" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: #f1f3f5; color: #17202b; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2.5 2.5l9 9 M11.5 2.5l-9 9"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px; border-bottom: 1px solid #edf0f2">
      <div role="group" aria-label="種類で絞る" style="display: flex; flex-wrap: wrap; gap: 6px">
        <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border: 1px solid {{accent}}; border-radius: 18px; background: {{accent}}; color: #ffffff; font: inherit; font-size: 13px; font-weight: 700">すべて 16</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 1px solid #cfd6dd; border-radius: 18px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">日常</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 1px solid #cfd6dd; border-radius: 18px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">極限</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 1px solid #cfd6dd; border-radius: 18px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">ひとり用</button>
      </div>
      <div style="flex: 1 1 auto"></div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3b4652">
        <input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: {{accent}}">
        いまの住人 10人 で遊べるものだけ
      </label>
    </div>

    <div style="display: flex; flex-wrap: wrap">
      <div style="flex: 999 1 560px; min-width: 0; padding: 16px 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-content: start">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="12">
          <button type="button" aria-pressed="{{it.on}}" style="display: block; text-align: left; padding: 10px 12px; border: {{it.border}}; border-radius: 10px; background: {{it.bg}}; font: inherit; color: #17202b; min-height: 72px">
            <span style="display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: #5b6672"><span>{{it.cat}}</span><span style="white-space: nowrap">{{it.n}}</span></span>
            <span style="display: block; font-weight: 700; font-size: 15px; margin-top: 2px">{{it.name}}</span>
            <span style="display: block; font-size: 11px; color: {{it.warnColor}}">{{it.warn}}</span>
          </button>
        </sc-for>
      </div>

      <aside aria-label="選んでいる箱庭" style="flex: 1 1 300px; max-width: 360px; padding: 20px; box-sizing: border-box; background: #f8f9fa; border-left: 1px solid #e3e7eb; display: flex; flex-direction: column; gap: 12px">
        <div style="font-size: 12px; color: #5b6672">密室・関係性　・　2〜12人</div>
        <h3 style="margin: 0; font-size: 22px">出られない部屋</h3>
        <p style="margin: 0; color: #3b4652">脱出の条件を満たすまで出られない、白い密室。</p>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span style="padding: 2px 10px; border-radius: 12px; background: #e9edf1; font-size: 12px; color: #3b4652">関係が中心</span>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="flex: 1 1 0; height: 40px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">TIPS</button>
          <button type="button" style="flex: 1 1 0; height: 40px; border: 1px solid #cfd6dd; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; color: #17202b">出来事の一覧</button>
        </div>
        <div style="flex: 1 1 auto"></div>
        <button type="button" style="height: 48px; border: 0; border-radius: 10px; background: {{accent}}; color: #ffffff; font: inherit; font-size: 15px; font-weight: 700">この箱庭にする</button>
        <div style="font-size: 12px; color: #5b6672">いまの箱庭：合コン（場の設定は箱庭ごとに残ります）</div>
      </aside>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 20px; border-top: 1px solid #edf0f2; font-size: 12px; color: #5b6672">
      <span>R-18版（18歳以上向け）では成人向けの箱庭が5つ増えます。</span>
      <a href="#" style="font-weight: 700">BOOTH</a>
      <a href="#" style="font-weight: 700">note</a>
    </div>
  </div>
</div>
</x-dc>



</body></html>
